services:
  database:
    container_name: kupipodariday-database
    image: postgres:14-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-schema.sh:/docker-entrypoint-initdb.d/init-schema.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  backend:
    container_name: kupipodariday-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-4000}:${PORT:-3001}"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network

  frontend:
    container_name: kupipodariday-frontend
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - frontend-network

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  pgdata:
